
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Compras Nube</title>
    <style>
        /* ESTILOS VISUALES (Igual que la versión anterior) */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f8; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1a202c; font-size: 1.5rem; margin-bottom: 20px; }
        
        /* Pestañas */
        .tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: none; border: none; padding: 12px; font-weight: 600; color: #718096; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: #3182ce; border-bottom: 3px solid #3182ce; }
        .tab-btn:hover { background-color: #f7fafc; }
        
        /* Secciones */
        .section { display: none; animation: fadeIn 0.3s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Formularios */
        label { display: block; margin-top: 15px; font-weight: 500; font-size: 0.9rem; color: #4a5568; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        input:focus { outline: none; border-color: #3182ce; ring: 2px solid #bee3f8; }

        /* Botones */
        .btn { width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn-primary { background-color: #3182ce; color: white; }
        .btn-primary:hover { background-color: #2b6cb0; }
        .btn-success { background-color: #38a169; color: white; }
        .btn-danger { background-color: #e53e3e; color: white; padding: 6px 12px; font-size: 0.8rem; margin: 0; width: auto; }
        .btn-add { background-color: #3182ce; color: white; border: none; border-radius: 6px; width: 50px; cursor: pointer; }

        /* Listas y Tablas */
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #f7fafc; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
        .result-card { background: #ebf8ff; border-left: 4px solid #3182ce; padding: 12px; margin-top: 10px; border-radius: 4px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f7fafc; color: #4a5568; font-weight: 600; }
        
        /* Indicador de carga */
        #status { text-align: center; font-size: 0.8rem; color: #718096; margin-top: 10px; }
        .loading { color: #d69e2e; }
        .online { color: #38a169; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 Gestor de Compras <span style="font-size:0.8rem; color:#718096">(Nube)</span></h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarPestana('registro')">Registrar</button>
        <button class="tab-btn" onclick="cambiarPestana('compra')">Comprar</button>
        <button class="tab-btn" onclick="cambiarPestana('catalogo')">Catálogo</button>
    </div>

    <div id="registro" class="section active">
        <label>Producto:</label>
        <input type="text" id="regProducto" list="listaProductos" placeholder="Ej. Cuaderno Prof.">
        <datalist id="listaProductos"></datalist>

        <label>Tienda / Proveedor:</label>
        <input type="text" id="regTienda" list="listaTiendas" placeholder="Ej. Lumen">
        <datalist id="listaTiendas"></datalist>

        <label>Precio Unitario ($):</label>
        <input type="number" id="regPrecio" step="0.1" placeholder="0.00">

        <button class="btn btn-primary" onclick="guardarPrecioEnNube()">💾 Guardar en Nube</button>
        <p id="status" class="loading">Conectando...</p>
    </div>

    <div id="compra" class="section">
        <label>Armar Lista:</label>
        <div style="display: flex; gap: 10px;">
            <select id="selCarrito"></select>
            <button class="btn-add" onclick="agregarAlCarrito()">➕</button>
        </div>

        <div id="listaVisual" style="margin-top: 20px;"></div>

        <button class="btn btn-success" onclick="calcularOptimo()">🚀 CALCULAR MEJOR OPCIÓN</button>
        <div id="resultadoFinal"></div>
    </div>

    <div id="catalogo" class="section">
        <button class="btn btn-primary" onclick="exportarCSV()" style="margin-bottom: 15px;">📥 Descargar Excel (.csv)</button>
        <div style="overflow-x:auto;">
            <table id="tablaDatos">
                <thead><tr><th>Producto</th><th>Tienda</th><th>$ Precio</th><th>Fecha</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    // 1. IMPORTAR FIREBASE DESDE LA RED (CDN)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ------------------------------------------------------------------
    // 2. PEGA AQUÍ TU CONFIGURACIÓN (PASO CRÍTICO)
    // ------------------------------------------------------------------
    const firebaseConfig = {
        // !!! BORRA ESTAS LÍNEAS Y PON TUS CLAVES DE FIREBASE AQUÍ !!!
        apiKey: "AIzaSyDVUcidSc7_csmF7RtSLRv15Oam7Ika8Qs",
    authDomain: "gestor-de-precios-abarrotesddj.firebaseapp.com",
    projectId: "gestor-de-precios-abarrotesddj",
    storageBucket: "gestor-de-precios-abarrotesddj.firebasestorage.app",
    messagingSenderId: "1012662122228",
    appId: "1:1012662122228:web:c745c2ebe88bd2fa8ed0a1"
    };
    // ------------------------------------------------------------------

    // 3. INICIALIZAR LA APP
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Variables de memoria local
    let baseDatos = {}; 
    let carrito = [];
    const statusEl = document.getElementById('status');

    // 4. ESCUCHAR CAMBIOS EN TIEMPO REAL
    // Esto se ejecuta automáticamente cuando hay datos nuevos en la nube
    const q = query(collection(db, "precios"), orderBy("fecha", "desc"));
    
    onSnapshot(q, (snapshot) => {
        baseDatos = {}; // Reiniciamos memoria
        
        snapshot.forEach((doc) => {
            const data = doc.data();
            // Reconstruimos la estructura para que el resto del código funcione
            if (!baseDatos[data.producto]) baseDatos[data.producto] = {};
            
            // Si ya existe la tienda, nos quedamos con el registro más reciente (opcional)
            // Aquí simplemente sobrescribimos porque ordenamos por fecha
            baseDatos[data.producto][data.tienda] = {
                precio: Number(data.precio),
                fecha: data.fecha
            };
        });

        // Actualizamos la interfaz
        actualizarDesplegables();
        renderizarTabla();
        
        statusEl.textContent = "🟢 Conectado y Sincronizado";
        statusEl.className = "online";
        console.log("Datos recibidos de Firebase");
    }, (error) => {
        statusEl.textContent = "🔴 Error de conexión: " + error.message;
        console.error(error);
    });

    // 5. FUNCIONES GLOBALES (Para que el HTML las encuentre)
    
    // --- Guardar ---
    window.guardarPrecioEnNube = async function() {
        const prod = document.getElementById('regProducto').value.trim().toLowerCase();
        const tienda = document.getElementById('regTienda').value.trim();
        const precio = parseFloat(document.getElementById('regPrecio').value);

        if (!prod || !tienda || isNaN(precio)) {
            alert("⚠️ Por favor completa todos los campos.");
            return;
        }

        statusEl.textContent = "⏳ Guardando...";
        
        try {
            await addDoc(collection(db, "precios"), {
                producto: prod,
                tienda: tienda,
                precio: precio,
                fecha: new Date().toISOString().split('T')[0]
            });
            
            // Limpiar campos
            document.getElementById('regProducto').value = ''; 
            document.getElementById('regPrecio').value = '';
            // Nota: No limpiamos tienda por si registras varios productos del mismo proveedor
            
        } catch (e) {
            alert("Error al guardar: " + e.message);
        }
    }

    // --- Interfaz ---
    window.cambiarPestana = function(id) {
        document.querySelectorAll('.section').forEach(d => d.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    function actualizarDesplegables() {
        const productos = Object.keys(baseDatos).sort();
        const tiendas = new Set();
        
        // Datalist Registro
        const dlProd = document.getElementById('listaProductos');
        dlProd.innerHTML = '';
        productos.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p;
            dlProd.appendChild(opt);
            // Recolectar tiendas
            Object.keys(baseDatos[p]).forEach(t => tiendas.add(t));
        });

        // Select Carrito
        const selCar = document.getElementById('selCarrito');
        const valorActual = selCar.value; // Intentar mantener selección
        selCar.innerHTML = '<option value="">Selecciona...</option>';
        productos.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p;
            opt.text = p.charAt(0).toUpperCase() + p.slice(1);
            selCar.appendChild(opt);
        });
        selCar.value = valorActual;

        // Datalist Tiendas
        const dlTienda = document.getElementById('listaTiendas');
        dlTienda.innerHTML = '';
        tiendas.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            dlTienda.appendChild(opt);
        });
    }

    function renderizarTabla() {
        const tbody = document.querySelector('#tablaDatos tbody');
        tbody.innerHTML = '';
        
        // Recorremos el objeto baseDatos
        for (const [prod, tiendas] of Object.entries(baseDatos)) {
            for (const [tienda, datos] of Object.entries(tiendas)) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-transform: capitalize;">${prod}</td>
                    <td>${tienda}</td>
                    <td>$${datos.precio.toFixed(2)}</td>
                    <td style="color:#718096; font-size:0.8rem">${datos.fecha}</td>
                `;
                tbody.appendChild(tr);
            }
        }
    }

    // --- Carrito y Optimización (Igual que antes) ---
    window.agregarAlCarrito = function() {
        const item = document.getElementById('selCarrito').value;
        if(item && !carrito.includes(item)) {
            carrito.push(item);
            renderizarCarritoVisual();
        }
    }

    function renderizarCarritoVisual() {
        const div = document.getElementById('listaVisual');
        div.innerHTML = '';
        carrito.forEach((item, index) => {
            div.innerHTML += `
                <div class="list-item">
                    <span style="text-transform: capitalize;">🛒 ${item}</span>
                    <button class="btn btn-danger" onclick="eliminarItem(${index})">✕</button>
                </div>
            `;
        });
    }

    window.eliminarItem = function(index) {
        carrito.splice(index, 1);
        renderizarCarritoVisual();
    }

    window.calcularOptimo = function() {
        if(carrito.length === 0) return;
        
        let html = '';
        let total = 0;

        carrito.forEach(item => {
            if(baseDatos[item]) {
                const tiendas = baseDatos[item];
                // Encontrar mínimo
                const mejorTienda = Object.keys(tiendas).reduce((a, b) => 
                    tiendas[a].precio < tiendas[b].precio ? a : b
                );
                const info = tiendas[mejorTienda];
                
                html += `
                    <div class="result-card">
                        <div style="font-weight:bold; text-transform:capitalize;">${item}</div>
                        <div>Comprar en: <b>${mejorTienda}</b></div>
                        <div style="font-size:1.1rem; color:#2c5282;">$${info.precio.toFixed(2)}</div>
                    </div>
                `;
                total += info.precio;
            } else {
                html += `<div class="result-card" style="border-color:red;">❌ ${item}: Sin datos</div>`;
            }
        });

        html += `<div style="margin-top:20px; text-align:center; font-size:1.2rem; font-weight:bold;">Total Estimado: $${total.toFixed(2)}</div>`;
        document.getElementById('resultadoFinal').innerHTML = html;
    }

    window.exportarCSV = function() {
        let csv = "Producto,Tienda,Precio,Fecha\n";
        for (const [prod, tiendas] of Object.entries(baseDatos)) {
            for (const [tienda, datos] of Object.entries(tiendas)) {
                csv += `${prod},${tienda},${datos.precio},${datos.fecha}\n`;
            }
        }
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `precios_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
    }
</script>

</body>
</html>
